n'com.xuper.wiwyxuper=WiwyXuper',
          ])
          simple('integer', 'columns', 6)
          simple('integer', 'rows_below_dock', 1)
          simple('bool', 'fill_dock', False)
          simple('bool', 'dock_row', True)
          simple('bool', 'dock_title', True)
          simple('bool', 'advanced_effects', False)
          simple('bool', 'reduced_motion', False)
          # Una caja HDMI de salida no tiene puertos HDMI de entrada propios.
          simple('string', 'live_tv_package', '')
          ET.indent(tree, space='    ')
          tree.write(path, encoding='utf-8', xml_declaration=True)
          print('Configuración aplicada: dock=6, columnas=6, fondo oscuro original, efectos avanzados desactivados')
          print('No se modifican paquetes instalados ni ajustes de la TV; solo el APK en GitHub.')
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK mínimo del build
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Compilar APK release firmado para pruebas (solo en GitHub)
        shell: bash
        working-directory: origen/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Comprobar integridad del APK generado
        shell: bash
        run: |
          set -eu
          APK=origen/launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "^package: name='com.gathin.tvhome'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "^sdkVersion:'26'"
          sha256sum "$APK" | tee SHA256_APK.txt
          echo "CleanYourTV upstream v2.5.0, personalizado para sti6140d360" > INFORME.txt
          echo "No incluye el clima doble (pendiente de implementación)." >> INFORME.txt
          echo "No se ha instalado en ningún dispositivo." >> INFORME.txt
          cp "$APK" CleanYourTV_Onn_4K_Prueba.apk

      - name: Entregar APK e integridad para revisión
        uses: actions/upload-artifact@v4
        with:
          name: APK-CleanYourTV-Onn4K-REVISAR-ANTES-DE-INSTALAR
          path: |
            CleanYourTV_Onn_4K_Prueba.apk
            SHA256_APK.txt
            INFORME.txt
          if-no-files-found: error
          retention-days: 7
