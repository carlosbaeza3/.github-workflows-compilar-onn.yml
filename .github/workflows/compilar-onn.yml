
name: Compilar CleanYourTV Onn 4K

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  crear-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Descargar CleanYourTV 2.5.0
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.5.0
          path: tv
          persist-credentials: false

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK necesario
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Configurar seis apps del dock
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('tv/launcher/app/src/main/res/values/config.xml')
          t = ET.parse(p)
          r = t.getroot()
          def arr(name, values):
              e = r.find(f"string-array[@name='{name}']")
              if e is None: raise RuntimeError('Falta ' + name)
              for child in list(e): e.remove(child)
              for value in values: ET.SubElement(e, 'item').text = value
          def val(tag, name, value):
              e = r.find(f"{tag}[@name='{name}']")
              if e is None: raise RuntimeError('Falta ' + name)
              e.text = str(value).lower() if isinstance(value, bool) else str(value)
          arr('dock_apps', ['com.netflix.ninja', 'com.xuper.netxxus', 'io.gh.reisxd.tizentube.cobalt', 'com.apple.atve.androidtv.appletv', 'com.wbd.stream', 'com.xuper.wiwyxuper'])
          arr('hidden_apps', [])
          arr('app_labels', ['com.xuper.netxxus=Xuper Hydra', 'io.gh.reisxd.tizentube.cobalt=TizenTube', 'com.wbd.stream=Max', 'com.xuper.wiwyxuper=WiwyXuper'])
          val('integer', 'columns', 6)
          val('integer', 'rows_below_dock', 1)
          val('bool', 'dock_row', True)
          val('bool', 'dock_title', True)
          val('bool', 'fill_dock', False)
          val('bool', 'advanced_effects', False)
          val('bool', 'reduced_motion', True)
          val('string', 'live_tv_package', '')
          ET.indent(t, space='  ')
          t.write(p, encoding='utf-8', xml_declaration=True)
          print('Configuracion del dock aplicada')
          PY

      - name: Compilar APK firmado para prueba
        working-directory: tv/launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar y preparar descarga
        run: |
          set -eu
          APK=tv/launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" CleanYourTV_Onn4K_PARA_REVISAR.apk
          sha256sum CleanYourTV_Onn4K_PARA_REVISAR.apk > SHA256.txt

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: CleanYourTV_Onn4K_PARA_REVISAR
          path: |
            CleanYourTV_Onn4K_PARA_REVISAR.apk
            SHA256.txt
          retention-days: 7
