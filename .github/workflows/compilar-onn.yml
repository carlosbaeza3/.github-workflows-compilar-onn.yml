name: Compilar CleanYourTV Onn 4K - dock 6

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crear-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Obtener codigo oficial CleanYourTV v2.5.0
        uses: actions/checkout@v4
        with:
          repository: Gathin23/cleanyourtv
          ref: v2.5.0
          path: tv
          persist-credentials: false

      - name: Personalizar seis apps sin claves inexistentes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          archivo = Path('tv/launcher/app/src/main/res/values/config.xml')
          if not archivo.is_file():
              raise SystemExit('No existe config.xml de CleanYourTV v2.5.0')
          arbol = ET.parse(archivo)
          raiz = arbol.getroot()
          if raiz.tag != 'resources':
              raise SystemExit('config.xml no es un recurso Android valido')

          def buscar(tipo, nombre):
              return raiz.find(f"{tipo}[@name='{nombre}']")

          def lista(nombre, valores):
              nodo = buscar('string-array', nombre)
              if nodo is None:
                  raise SystemExit('Configuracion oficial sin lista: ' + nombre)
              for hijo in list(nodo):
                  nodo.remove(hijo)
              for valor in valores:
                  ET.SubElement(nodo, 'item').text = valor

          def campo(tipo, nombre, valor, obligatorio=False):
              nodo = buscar(tipo, nombre)
              if nodo is None:
                  if obligatorio:
                      raise SystemExit('Configuracion oficial sin campo: ' + nombre)
                  print('Omitido (no existe en esta version): ' + nombre)
                  return
              nodo.text = str(valor).lower() if isinstance(valor, bool) else str(valor)

          lista('dock_apps', [
              'com.netflix.ninja',
              'com.xuper.netxxus',
              'io.gh.reisxd.tizentube.cobalt',
              'com.apple.atve.androidtv.appletv',
              'com.wbd.stream',
              'com.xuper.wiwyxuper',
          ])
          lista('app_labels', [
              'com.xuper.netxxus=Xuper Hydra',
              'io.gh.reisxd.tizentube.cobalt=TizenTube',
              'com.wbd.stream=Max',
              'com.xuper.wiwyxuper=WiwyXuper',
          ])
          # No ocultar aplicaciones: las dos MXL quedan en la cuadricula.
          lista('hidden_apps', [])
          campo('integer', 'columns', 6, obligatorio=True)
          campo('integer', 'rows_below_dock', 1)
          campo('bool', 'dock_row', True)
          campo('bool', 'dock_title', True)
          campo('bool', 'fill_dock', False)
          campo('bool', 'advanced_effects', False)
          campo('bool', 'reduced_motion', True)
          campo('string', 'live_tv_package', '')
          # No modificar asistentes, Cast, Wi-Fi, apps instaladas ni Home.
          # No usar dock_glass: no existe en CleanYourTV 2.5.0.
          ET.indent(arbol, space='  ')
          arbol.write(archivo, encoding='utf-8', xml_declaration=True)
          print('Configuracion creada y XML validado: 6 apps de dock')
          PY

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar SDK Android moderno
        uses: android-actions/setup-android@v4

      - name: Instalar Android SDK 34
        shell: bash
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'

      - name: Compilar APK firmado con llave de prueba
        working-directory: tv/launcher
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verificar firma, SDK y paquete
        shell: bash
        run: |
          set -eu
          APK='tv/launcher/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "^package: name='com.gathin.tvhome'"
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | grep "^sdkVersion:'26'"
          cp "$APK" 'CleanYourTV_Onn_4K_REVISAR.apk'
          sha256sum 'CleanYourTV_Onn_4K_REVISAR.apk' > SHA256.txt
          printf '%s\n' 'Base: CleanYourTV v2.5.0' 'Dock: 6 aplicaciones' 'No incluye clima doble de Merida y Telchac Pueblo' 'No instalar antes de revisar el APK' > LEEME.txt

      - name: Descargar APK para revision
        uses: actions/upload-artifact@v4
        with:
          name: APK_CleanYourTV_Onn4K_REVISAR
          path: |
            CleanYourTV_Onn_4K_REVISAR.apk
            SHA256.txt
            LEEME.txt
          if-no-files-found: error
          retention-days: 7
